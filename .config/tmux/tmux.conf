# prefix はデフォルトの Ctrl+b
set -g prefix C-b
bind C-b send-prefix

# マウス操作を有効化
set -g mouse on

# マウスホイールでスクロール時に自動でコピーモードへ入る
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# === WezTerm に合わせたキーバインド (prefix = C-b) ===

# ペイン分割: v=左右(split -h), s=上下(split -v) ※cwd 引き継ぎ
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# ペイン移動 (vim 風)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインを閉じる (x, 確認あり) ＝ tmux デフォルトと同じ挙動
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# 新規タブ (t, cwd 引き継ぎ＝複製) / タブを閉じる (q, 確認あり)
bind t new-window -c "#{pane_current_path}"
bind q confirm-before -p "kill-window #W? (y/n)" kill-window

# リサイズモード (r → h/j/k/l で 5 刻み, Esc/Enter で抜ける)
bind r switch-client -T RESIZE
bind -T RESIZE h resize-pane -L 5 \; switch-client -T RESIZE
bind -T RESIZE j resize-pane -D 5 \; switch-client -T RESIZE
bind -T RESIZE k resize-pane -U 5 \; switch-client -T RESIZE
bind -T RESIZE l resize-pane -R 5 \; switch-client -T RESIZE
bind -T RESIZE Escape switch-client -T root
bind -T RESIZE Enter  switch-client -T root

# タブ移動(n/p)・番号(1-5)・コピーモード([) は tmux デフォルトが
# WezTerm と一致するため未設定 (= デフォルトのまま使用)

# ウィンドウ番号を 1 始まりに
set -g base-index 1
setw -g pane-base-index 1

# 256色サポート (tmux-256color = WezTerm の透過がすり抜けやすい)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ペイン背景は塗らず WezTerm の透過を維持
# (背景色で塗ると不透明になり透過が効かないため bg=default)
set -g window-style        "bg=default"
set -g window-active-style "bg=default"

# アクティブペインはボーダーの色で区別する
set -g pane-border-style        "fg=colour238"  # 非アクティブ枠 = 暗いグレー
set -g pane-active-border-style "fg=colour39"   # アクティブ枠 = 明るい青

# ステータスバー
set -g status-bg colour235
set -g status-fg colour136
set -g status-left " [#S] "
set -g status-right " %Y-%m-%d %H:%M "

# コピーモードを Vi キーバインドに
setw -g mode-keys vi
